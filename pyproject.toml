[project]
name = "databridge"
version = "0.1.0"
description = "MySQL 表数据同步工具（Web GUI + 未来 MCP）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pymysql>=1.1",
    "cryptography>=42.0",
    "mcp>=1.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 固定临时目录到项目内，规避系统 Temp 目录 ACL 异常
addopts = "--basetemp=.pytest_tmp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["databridge"]
